[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features="mobile_apk"
export_filter="all_resources"
include_filter="*.json, *.bin, *.ttf, *.png, *.jpg, *.jpeg, *.ogg, *.wav"
exclude_filter="data/levels_act*.json, docs/*, ci_compile_godot4_v4.sh, .github/*, *.md"
