name: Build Godchard Adventure Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble Signed Release & Debug APKs
        run: gradle assembleRelease assembleDebug --no-daemon

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: GodchardAdventure-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GodchardAdventure-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
