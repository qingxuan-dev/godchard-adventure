name: Build Godot 4 Native APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-godot4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build and Publish Native Godot 4 APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m venv /tmp/gd
          /tmp/gd/bin/pip install -q gdown
          /tmp/gd/bin/gdown 1sw6fvLugvRFZ6migQBDgrj-fBSAdxJfo -O pkg.zip
          unzip -oq pkg.zip
          sed -i 's/min_sdk="24"/min_sdk=""/g; s/target_sdk="34"/target_sdk=""/g' godot4_project/export_presets.cfg
          sed -i 's/--clobber/|| true/g' ci_build_godot4_apk.sh
          echo 'textures/vram_compression/import_etc2_astc=true' >> godot4_project/project.godot
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core fonts-droid-fallback python3-pil
          python3 -m pip install -q --break-system-packages pillow || python3 -m pip install -q pillow || true
          export SKIP_APT=1
          python3 -c 'import json; exec(chr(10).join(json.load(open("godot4-edition/v32_5.json"))["hook"]))'
          bash ci_build_godot4_apk.sh
